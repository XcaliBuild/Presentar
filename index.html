<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pages. Presentar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='6' width='14' height='16' rx='2' fill='%230A0C10' stroke='%23C9A430' stroke-width='1.4'/%3E%3Crect x='7' y='2' width='14' height='16' rx='2' fill='%23161B24' stroke='%23C9A430' stroke-width='1.4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;600;700&family=Roboto:wght@300;400;700&family=Space+Mono&family=Cinzel:wght@600;700&family=Pacifico&family=Raleway:wght@400;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    <script src="https://unpkg.com/localforage@1.10.0/dist/localforage.min.js"></script> <style>
        :root{
            --ink-950:#0A0C10; --ink-900:#12151C; --ink-850:#171B24; --ink-800:#1B2029; --ink-750:#232936;
            --ink-border: rgba(255,255,255,0.08); --ink-border-strong: rgba(255,255,255,0.14);
            --gold-600:#A9871F; --gold-500:#C9A430; --gold-400:#E3BE55; --gold-tint: rgba(201,164,48,0.15);
            --text-hi:#F2F1ED; --text-mid:#AEB2BE; --text-low:#767A88; --danger:#E5626A; --danger-tint: rgba(229,98,106,0.14);
            --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
            --shadow-panel: 0 1px 2px rgba(0,0,0,0.45), 0 12px 30px rgba(0,0,0,0.35);
            --shadow-pop: 0 20px 60px rgba(0,0,0,0.5);
            --app-bg-1:#0A0C10; --app-bg-2:#141824; --app-bg-3:#0D1018;
            --panel-bg: rgba(23,27,36,0.72); --panel-blur: blur(18px); --field-bg: rgba(255,255,255,0.04);
        }

        body.theme-papier{
            --ink-950:#EFEAE0; --ink-900:#F7F4EC; --ink-850:#FFFFFF; --ink-800:#FFFFFF; --ink-750:#F1ECE0;
            --ink-border: rgba(20,20,15,0.10); --ink-border-strong: rgba(20,20,15,0.18);
            --gold-600:#8C6C13; --gold-500:#A9871F; --gold-400:#C9A430; --gold-tint: rgba(169,135,31,0.14);
            --text-hi:#20222A; --text-mid:#585B68; --text-low:#8A8D98;
            --shadow-panel: 0 1px 2px rgba(20,15,5,0.06), 0 12px 28px rgba(20,15,5,0.08);
            --shadow-pop: 0 20px 50px rgba(20,15,5,0.18);
            --app-bg-1:#EDE8DC; --app-bg-2:#F7F4EC; --app-bg-3:#E7E1D2;
            --panel-bg: rgba(255,255,255,0.75); --field-bg: rgba(20,15,5,0.035);
        }

        *{ box-sizing:border-box; margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; }
        html,body{ height:100%; }
        body{
            background: linear-gradient(160deg, var(--app-bg-1), var(--app-bg-2) 55%, var(--app-bg-3));
            color:var(--text-hi); height:100vh; display:flex; flex-direction:column; overflow:hidden;
            -webkit-font-smoothing:antialiased; padding:10px; gap:10px; transition: color .35s ease;
        }

        ::-webkit-scrollbar{ width:6px; height:6px; }
        ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:rgba(140,140,150,0.35); border-radius:10px; }
        :focus-visible{ outline:2px solid var(--gold-400); outline-offset:2px; }
        button{ font:inherit; }

        .glass{
            background:var(--panel-bg); backdrop-filter:var(--panel-blur); -webkit-backdrop-filter:var(--panel-blur);
            border:1px solid var(--ink-border); box-shadow:var(--shadow-panel); border-radius:var(--radius-lg);
            transition: background .35s ease, border-color .35s ease;
        }
        .icon{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0; }
        .icon-sm{ width:14px; height:14px; }

        /* ---------- Header ---------- */
        .app-header{ height:60px; padding:0 18px; display:flex; align-items:center; justify-content:space-between; z-index:30; gap:16px; flex-shrink: 0;}
        .brand{ display:flex; align-items:center; gap:10px; user-select:none; flex-shrink:0; }
        .brand-mark{ width:26px; height:26px; position:relative; flex-shrink:0; }
        .brand-mark span{ position:absolute; inset:0; border-radius:5px; border:1.4px solid var(--gold-500); }
        .brand-mark span:first-child{ top:4px; left:0; background:var(--ink-950); }
        .brand-mark span:last-child{ top:0; left:4px; background:var(--ink-800); }
        .brand-word{ font-size:1.05rem; letter-spacing:-0.2px; white-space:nowrap; }
        .brand-word b{ font-weight:700; }
        .brand-word em{ font-style:normal; font-weight:700; font-family:'Playfair Display',serif; background:linear-gradient(120deg,var(--gold-400),var(--gold-600)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-left:2px; }
        .doc-title-input{
            background:var(--field-bg); border:1px solid transparent; color:inherit; padding:8px 14px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:500; width:280px; text-align:center; outline:none; transition:all .2s ease;
        }
        .doc-title-input:focus{ border-color:var(--ink-border-strong); background:rgba(255,255,255,0.07); }
        .header-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

        .theme-swatches{ display:flex; gap:6px; padding:3px; border:1px solid var(--ink-border); border-radius:999px; }
        .theme-swatch{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
        .theme-swatch.nuit{ background: linear-gradient(135deg,#12151C,#232936); }
        .theme-swatch.papier{ background: linear-gradient(135deg,#FFFFFF,#EDE8DC); }
        .theme-swatch.active{ border-color:var(--gold-500); }

        /* ---------- Buttons ---------- */
        .btn{
            display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px; border-radius:var(--radius-sm); font-size:0.82rem; font-weight:600; cursor:pointer; border:1px solid var(--ink-border); color:var(--text-hi); background:var(--field-bg); white-space:nowrap; transition:all .15s ease; user-select:none;
        }
        .btn:hover{ background:rgba(255,255,255,0.08); border-color:var(--ink-border-strong); }
        body.theme-papier .btn:hover{ background:rgba(20,15,5,0.06); }
        .btn:active{ transform:translateY(1px); }
        .btn-icon{ padding:9px; width:36px; height:36px; }
        .btn-primary{ background:linear-gradient(135deg,var(--gold-400),var(--gold-600)); border:none; color:#191203; box-shadow:0 6px 18px rgba(201,164,48,0.35); }
        .btn-primary:hover{ filter:brightness(1.08); }
        .btn-ghost-danger{ color:var(--text-mid); }
        .btn-ghost-danger:hover{ color:var(--danger); background:var(--danger-tint); border-color:transparent; }
        .btn[disabled], .btn.disabled{ opacity:0.32; pointer-events:none; }
        .btn.active{ color:var(--gold-400); border-color:var(--gold-500); background:var(--gold-tint); }

        [data-tip]{ position:relative; }
        [data-tip]::after{
            content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(2px); background:var(--ink-950); color:var(--text-hi); font-size:11px; font-weight:500; padding:5px 9px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:60; border:1px solid var(--ink-border-strong);
        }
        [data-tip]:hover::after{ opacity:1; transform:translateX(-50%) translateY(0); }

        /* ---------- Inputs ---------- */
        .field{ height:36px; border:1px solid var(--ink-border); border-radius:var(--radius-sm); padding:0 10px; font-size:0.82rem; background:var(--field-bg); color:inherit; outline:none; }
        select.field option{ background-color:#1b2029; color:#F2F1ED; }
        .field-num{ width:58px; text-align:center; }
        .field-color{ width:36px; height:36px; padding:2px; border:1px solid var(--ink-border); border-radius:var(--radius-sm); background:var(--field-bg); cursor:pointer; }
        .field-color::-webkit-color-swatch-wrapper{ padding:2px; }
        .field-color::-webkit-color-swatch{ border-radius:5px; border:none; }

        /* ---------- Workspace ---------- */
        .workspace{ display:flex; flex:1; gap:10px; overflow:hidden; }
        .slides-sidebar{ width:206px; display:flex; flex-direction:column; padding:14px; gap:12px; overflow-y:auto; flex-shrink:0; }
        .slide-thumbnail{ width:100%; aspect-ratio:16/9; border-radius:var(--radius-md); cursor:grab; position:relative; overflow:hidden; border:2px solid transparent; transition:border-color .2s ease, transform .2s ease; flex-shrink:0; }
        .slide-thumbnail:hover{ transform:translateY(-1px); }
        .slide-thumbnail.active{ border-color:var(--gold-500); }
        .slide-thumbnail.drag-over{ border-color:var(--text-mid); border-style:dashed; }
        .slide-thumbnail::after{ content:''; position:absolute; top:0; right:0; width:0; height:0; border-style:solid; border-width:0 14px 14px 0; border-color:transparent var(--gold-500) transparent transparent; opacity:0.85; }
        .thumb-scaler{ position:absolute; top:0; left:0; width:960px; height:540px; transform-origin:top left; pointer-events:none; }
        .slide-number{ position:absolute; bottom:6px; left:6px; background:rgba(0,0,0,0.55); color:#fff; font-size:0.68rem; font-weight:600; padding:2px 7px; border-radius:5px; }
        .thumb-delete{ position:absolute; bottom:6px; right:6px; width:22px; height:22px; border-radius:6px; border:none; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s ease; cursor:pointer; }
        .slide-thumbnail:hover .thumb-delete{ opacity:1; }
        .thumb-delete:hover{ background:var(--danger); }
        .thumb-add{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; aspect-ratio:16/9; width:100%; border:1.5px dashed var(--ink-border-strong); border-radius:var(--radius-md); background:transparent; color:var(--text-mid); cursor:pointer; font-size:0.72rem; font-weight:600; flex-shrink:0; }
        .thumb-add:hover{ color:var(--gold-400); border-color:var(--gold-500); }

        .stage-container{ flex:1; display:flex; align-items:center; justify-content:center; padding:26px; position:relative; overflow:hidden; }
        .canvas-scaler{ width:960px; height:540px; transform-origin:center center; flex-shrink:0; position: relative; }
        .slide-canvas{ width:960px; height:540px; border-radius:var(--radius-md); box-shadow:var(--shadow-pop); position:relative; overflow:hidden; background-size:cover; background-position:center; }
        
        .guide-line{ position:absolute; background:var(--gold-400); z-index:500; opacity:0; pointer-events:none; box-shadow:0 0 6px rgba(227,190,85,0.7); }
        .guide-line.v{ top:0; width:1px; height:540px; }
        .guide-line.h{ left:0; height:1px; width:960px; }
        .guide-line.show{ opacity:0.9; }

        .canvas-element{ position:absolute; cursor:grab; user-select:none; border-radius:4px; }
        .canvas-element.selected{ box-shadow:0 0 0 2px var(--gold-500); z-index: 100; }
        .canvas-element[contenteditable="true"]{ cursor:text; box-shadow:0 0 0 2px var(--gold-400); }
        .canvas-element img{ width:100%; height:100%; object-fit:cover; pointer-events:none; border-radius:4px; }
        .canvas-element iframe, .canvas-element video{ width:100%; height:100%; border:none; pointer-events:auto; border-radius:4px; }
        
        .page-number-badge{ position:absolute; bottom:14px; right:18px; font-size:13px; color:rgba(120,120,120,0.7); font-family:'Inter',sans-serif; }
        
        .resize-handle{ position:absolute; width:11px; height:11px; background:var(--gold-500); border:2px solid #14161c; border-radius:3px; z-index:20; }
        .resize-handle.nw{ top:-6px; left:-6px; cursor:nwse-resize; }
        .resize-handle.ne{ top:-6px; right:-6px; cursor:nesw-resize; }
        .resize-handle.sw{ bottom:-6px; left:-6px; cursor:nesw-resize; }
        .resize-handle.se{ bottom:-6px; right:-6px; cursor:nwse-resize; }
        .resize-handle.e{ top:50%; right:-6px; margin-top:-6px; cursor:ew-resize; }

        /* ---------- Inspector (Barre de droite) ---------- */
        .inspector-sidebar{ width:320px; display:flex; flex-direction:column; gap:0; overflow-y:auto; flex-shrink:0; border-left:1px solid var(--ink-border); }
        .inspector-section{ padding:16px; border-bottom:1px solid var(--ink-border); display:flex; flex-direction:column; gap:12px; }
        .panel-title{ font-size:0.85rem; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--text-hi); text-transform:uppercase; letter-spacing:0.5px;}
        
        /* Grille d'outils d'ajout (Outils globaux) */
        .tools-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tools-grid .btn { flex-direction: column; padding: 10px 4px; font-size: 0.7rem; gap: 4px; height: auto; }
        
        .form-field{ display:flex; flex-direction:column; gap:6px; }
        .form-field label{ font-size:0.68rem; font-weight:700; color:var(--text-low); text-transform:uppercase; letter-spacing:0.6px; }
        .form-field textarea{ resize:vertical; min-height:70px; font-size:0.85rem; line-height:1.4; padding:9px 10px; }
        .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .icon-row{ display:flex; gap:8px; }
        .small-note{ font-size:0.72rem; color:var(--text-low); }

        /* ---------- Toast ---------- */
        #toast-stack{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:10050; align-items:center; }
        .toast{ padding:11px 18px; border-radius:999px; font-size:0.82rem; font-weight:500; color:var(--text-hi); background:var(--ink-900); border:1px solid var(--ink-border-strong); box-shadow:var(--shadow-panel); opacity:0; transform:translateY(10px); transition:all .25s ease; }
        .toast.show{ opacity:1; transform:translateY(0); }
        .toast.error{ border-color:rgba(229,98,106,0.5); }
        .toast.success{ border-color:rgba(45, 255, 125, 0.5); }

        /* ---------- Modal ---------- */
        #modal-root{ position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; background:rgba(6,7,10,0.55); backdrop-filter:blur(3px); }
        #modal-root.show{ display:flex; }
        .modal-box{ width:380px; max-width:92vw; border-radius:var(--radius-lg); padding:22px; display:flex; flex-direction:column; gap:14px; background:var(--ink-850); border:1px solid var(--ink-border-strong); box-shadow:var(--shadow-pop); }
        .modal-title{ font-size:1rem; font-weight:700; }
        .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
        .file-drop{ border:1.5px dashed var(--ink-border-strong); border-radius:var(--radius-sm); padding:10px; font-size:0.78rem; color:var(--text-mid); text-align:center; cursor:pointer; }
        .file-drop:hover{ border-color:var(--gold-500); color:var(--gold-400); }
        .or-sep{ display:flex; align-items:center; gap:8px; color:var(--text-low); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.6px; }
        .or-sep::before, .or-sep::after{ content:''; flex:1; height:1px; background:var(--ink-border); }

        /* ---------- Animations & Transitions ---------- */
        .trans-fade-enter{ animation:fadeIn .7s ease forwards; }
        .trans-blur-enter{ animation:blurScaleIn .7s cubic-bezier(.16,1,.3,1) forwards; }
        .trans-3d-flip-enter{ animation:flipIn3D .9s cubic-bezier(.16,1,.3,1) forwards; perspective:1500px; transform-style:preserve-3d; }
        .trans-slide-enter{ animation:slideIn .7s cubic-bezier(.16,1,.3,1) forwards; }
        .trans-zoom-enter{ animation:zoomInFull .7s cubic-bezier(.16,1,.3,1) forwards; }
        .trans-bounce-enter{ animation:bounceIn .8s cubic-bezier(.175, .885, .32, 1.275) forwards; }
        .trans-slide-up-enter{ animation:slideUpFull .7s cubic-bezier(.16,1,.3,1) forwards; }

        @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
        @keyframes blurScaleIn{ from{transform:scale(1.04); filter:blur(16px); opacity:0;} to{transform:scale(1); filter:blur(0); opacity:1;} }
        @keyframes flipIn3D{ from{transform:rotateY(-85deg); opacity:0;} to{transform:rotateY(0deg); opacity:1;} }
        @keyframes slideIn{ from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;} }
        @keyframes zoomInFull{ from{transform:scale(0.8); opacity:0;} to{transform:scale(1); opacity:1;} }
        @keyframes bounceIn{ 0%{transform:scale(0.3); opacity:0;} 50%{transform:scale(1.05); opacity:1;} 70%{transform:scale(0.9);} 100%{transform:scale(1); opacity:1;} }
        @keyframes slideUpFull{ from{transform:translateY(100%); opacity:0;} to{transform:translateY(0); opacity:1;} }

        /* Element animations */
        .anim-fade{ animation:fadeIn .8s ease forwards; }
        .anim-slide-up{ animation:slideUp .7s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-pop{ animation:popIn .55s cubic-bezier(.175,.885,.32,1.275) forwards; }
        .anim-slide-left{ animation:slideLeft .7s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-slide-right{ animation:slideRight .7s cubic-bezier(.16,1,.3,1) forwards; }
        
        @keyframes slideUp{ from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
        @keyframes slideLeft{ from{transform:translateX(-40px); opacity:0;} to{transform:translateX(0); opacity:1;} }
        @keyframes slideRight{ from{transform:translateX(40px); opacity:0;} to{transform:translateX(0); opacity:1;} }
        @keyframes popIn{ from{transform:scale(.55); opacity:0;} to{transform:scale(1); opacity:1;} }

        /* ---------- Presentation ---------- */
        #presentation-overlay{ display:none; position:fixed; inset:0; background:#000; z-index:9999; align-items:center; justify-content:center; }
        #presentation-overlay.active{ display:flex; }
        .present-slide{ width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; position:relative; overflow:hidden; background-size:cover; background-position:center; }
        
        /* Laser & Drawing Overlay */
        #presentation-draw-canvas { position: absolute; inset: 0; z-index: 10000; pointer-events: none; }
        #laser-pointer{
            display:none; position:fixed; width:13px; height:13px; background:#ff2d4d;
            border-radius:50%; pointer-events:none; z-index:10001;
            box-shadow:0 0 16px 6px rgba(255,45,77,0.55); transform:translate(-50%,-50%);
        }
        #laser-pointer.active{ display:block; }
        #laser-pointer.clicking{ width:9px; height:9px; box-shadow:0 0 20px 8px rgba(255,255,255,0.8) !important; }

        .present-controls{
            position:absolute; bottom:26px; left:50%; transform:translateX(-50%); background:rgba(10,10,14,0.6);
            backdrop-filter:blur(14px); padding:9px 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.1);
            display:flex; gap:14px; align-items:center; z-index:10002; opacity:0; transition:opacity .3s ease;
        }
        .present-controls button{ background:rgba(255,255,255,0.08); border:none; color:#fff; width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .present-controls button:hover{ background:rgba(255,255,255,0.18); }
        .present-controls .badge{ font-size:0.78rem; color:#c9cdd6; padding:0 4px; font-variant-numeric:tabular-nums; }
        .present-controls .divider{ width:1px; height:18px; background:rgba(255,255,255,0.15); }
    </style>
</head>
<body>

    <header class="app-header glass">
        <div class="brand">
            <div class="brand-mark"><span></span><span></span></div>
            <div class="brand-word"><b>The Pages.</b><em>Presentar</em></div>
        </div>
        <input type="text" id="presentation-title" class="doc-title-input" value="Formation & Présentations Professionnelles" oninput="presentation.title=this.value; saveToDB();">
        <div class="header-actions">
            <div class="theme-swatches">
                <button class="theme-swatch nuit active" data-theme="nuit" title="Thème Nuit" onclick="setTheme('nuit')"></button>
                <button class="theme-swatch papier" data-theme="papier" title="Thème Papier" onclick="setTheme('papier')"></button>
            </div>
            <button class="btn btn-icon" id="btn-page-numbers" data-tip="Numéros de page" onclick="togglePageNumbers()"></button>
            <button class="btn btn-icon" data-tip="Exporter (.pages.data)" onclick="exportPagesData()"></button>
            <button class="btn btn-icon" data-tip="Exporter (.pptx PowerPoint)" onclick="exportPPT()"></button>
            <button class="btn btn-icon" data-tip="Importer" onclick="document.getElementById('import-input').click()"></button>
            <input type="file" id="import-input" accept=".json,.data" style="display:none" onchange="importProjectFile(this.files[0])">
            <button class="btn btn-primary" onclick="startPresentation()"></button>
        </div>
    </header>

    <div class="workspace">
        <div class="slides-sidebar glass" id="slides-container"></div>
        
        <div class="stage-container" onclick="deselectAll(event)">
            <div class="canvas-scaler" id="canvas-scaler">
                <div class="slide-canvas" id="main-canvas">
                    <div class="guide-line v" id="guide-v"></div>
                    <div class="guide-line h" id="guide-h"></div>
                </div>
            </div>
        </div>

        <div class="inspector-sidebar glass">
            <div class="inspector-section">
                <h3 class="panel-title">Création</h3>
                <div class="tools-grid">
                    <button class="btn" onclick="addTextElement()" id="btn-add-text"></button>
                    <button class="btn" onclick="promptAddImage()" id="btn-add-image"></button>
                    <button class="btn" onclick="promptAddVideo()" id="btn-add-video"></button>

function icon(name, cls){ return '<svg class="icon ' + (cls||'') + '" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + ICON_PATHS[name] + '</svg>'; }

// Polices étendues
const FONTS = [
    { name:"Inter", val:"'Inter', sans-serif" }, { name:"Poppins", val:"'Poppins', sans-serif" },
    { name:"Montserrat", val:"'Montserrat', sans-serif" }, { name:"Roboto", val:"'Roboto', sans-serif" },
    { name:"Raleway", val:"'Raleway', sans-serif" }, { name:"Lato", val:"'Lato', sans-serif" },
    { name:"Nunito", val:"'Nunito', sans-serif" }, { name:"Ubuntu", val:"'Ubuntu', sans-serif" },
    { name:"Playfair Display", val:"'Playfair Display', serif" }, { name:"Merriweather", val:"'Merriweather', serif" },
    { name:"Cinzel", val:"'Cinzel', serif" }, { name:"Pacifico", val:"'Pacifico', cursive" },

    { name:"Courier Prime", val:"'Courier Prime', monospace" }
];

/* =======================================================================
   DONNÉES & ÉTAT
======================================================================= */
let presentation = {
    title: 'Formation & Présentations', theme: 'nuit', showPageNumbers: false,
    slides: [{
        id: 1, background: { color: '#ffffff', image: null }, transition: 'trans-blur-enter', notes: '',
        elements: [
            { id:'e1', type:'text', content:'Formation & Présentations', x:80, y:150, width:780, fontSize:'62px', fontFamily:"'Playfair Display', serif", color:'#1e293b', fontWeight:'bold', textAlign:'left', animation:'anim-slide-up' },
            { id:'e2', type:'text', content:"Des supports clairs, élégants et efficaces.", x:80, y:330, width:640, fontSize:'22px', fontFamily:"'Inter', sans-serif", color:'#475569', textAlign:'left', animation:'anim-fade' }
        ]
    }]
};

let currentSlideIndex = 0, selectedElementId = null;
let isDragging = false, dragOffset = {x:0,y:0}, dragElW = 0, dragElH = 0;
let isResizing = false, resizeInfo = null;
let canvasScale = 1;
let historyStack = [];
let draggedSlideIndex = null, presentIndex = 0;
let isLaserActive = false, presentTimerHandle = null, controlsHideTimeout = null;
let clickStartX = 0, clickStartY = 0, isDrawing = false, drawCtx = null;

function getCurrentSlide(){ return presentation.slides[currentSlideIndex]; }
function saveToDB(){ localforage.setItem('presentar_backup', presentation); }

/* =======================================================================
   HISTORIQUE (ANNULER)
======================================================================= */
function pushHistory(){
    historyStack.push(JSON.stringify(presentation));
    if (historyStack.length > 40) historyStack.shift();
    saveToDB();
}

function undo(){
    if (historyStack.length === 0){ toast('Rien à annuler'); return; }
    presentation = JSON.parse(historyStack.pop());
    if (currentSlideIndex >= presentation.slides.length) currentSlideIndex = presentation.slides.length - 1;
    selectedElementId = null;
    document.getElementById('presentation-title').value = presentation.title;
    renderSidebar(); renderCanvas(); renderInspector();
    toast('Action annulée');
    saveToDB();
}

/* =======================================================================
   NOTIFICATIONS & MODALES
======================================================================= */
function toast(message, type){
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
}

function readFileAsDataURL(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onload = () => resolve(reader.result);
        reader.onerror = reject; reader.readAsDataURL(file);
    });
}

function openModal(config){
    return new Promise((resolve) => {
        const root = document.getElementById('modal-root'), box = document.getElementById('modal-box');
        let fieldsHtml = '';
        config.fields.forEach(f => {
            if (f.type === 'file'){
                fieldsHtml += '<div class="or-sep">ou</div><div class="form-field"><label>' + f.label + '</label><div class="file-drop" onclick="document.getElementById(\'modal-file-' + f.key + '\').click()">Choisir un fichier<input type="file" id="modal-file-' + f.key + '" accept="' + (f.accept||'') + '" style="display:none" onchange="this.previousSibling && null; document.getElementById(\'modal-file-name-' + f.key + '\').textContent = this.files[0] ? this.files[0].name : \'Choisir un fichier\';"></div><div id="modal-file-name-' + f.key + '" class="small-note"></div></div>';
            } else {
                fieldsHtml += '<div class="form-field"><label>' + f.label + '</label><input class="field" id="modal-field-' + f.key + '" type="text" placeholder="' + (f.placeholder||'') + '" style="width:100%;"></div>';
            }
        });
        box.innerHTML = '<div class="modal-title">' + config.title + '</div>' + fieldsHtml + '<div class="modal-actions"><button class="btn" id="modal-cancel">Annuler</button><button class="btn btn-primary" id="modal-confirm">' + (config.confirmLabel || 'Ajouter') + '</button></div>';
        root.classList.add('show');
        const cleanup = (value) => { root.classList.remove('show'); resolve(value); };
        document.getElementById('modal-cancel').onclick = () => cleanup(null);
        root.onclick = (e) => { if (e.target === root) cleanup(null); };
        document.getElementById('modal-confirm').onclick = async () => {
            const values = {};
            for (const f of config.fields){
                if (f.type === 'file'){
                    const input = document.getElementById('modal-file-' + f.key);
                    if (input.files && input.files[0]) values[f.key] = await readFileAsDataURL(input.files[0]); else values[f.key] = null;
                } else { values[f.key] = document.getElementById('modal-field-' + f.key).value.trim(); }
            }
            cleanup(values);
        };
    });
}

/* =======================================================================
   RENDU BARRE LATÉRALE GAUCHE (MINIATURES)
======================================================================= */
function renderSidebar(){
    const container = document.getElementById('slides-container');
    container.innerHTML = '';
    presentation.slides.forEach((slide, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'slide-thumbnail' + (idx === currentSlideIndex ? ' active' : '');
        thumb.draggable = true;
        thumb.ondragstart = () => { draggedSlideIndex = idx; };
        thumb.ondragover = (e) => { e.preventDefault(); thumb.classList.add('drag-over'); };
        thumb.ondragleave = () => thumb.classList.remove('drag-over');
        thumb.ondrop = (e) => { e.preventDefault(); thumb.classList.remove('drag-over'); onSlideDrop(idx); };
        thumb.onclick = (e) => { e.stopPropagation(); switchSlide(idx); };
        
        const inner = document.createElement('div');
        inner.className = 'thumb-scaler';
        inner.style.backgroundColor = slide.background.color || '#ffffff';
        if (slide.background.image){ inner.style.backgroundImage = 'url(' + slide.background.image + ')'; inner.style.backgroundSize = 'cover'; }
        
        slide.elements.forEach(el => {
            const mini = document.createElement('div');
            mini.style.position = 'absolute'; mini.style.left = el.x + 'px'; mini.style.top = el.y + 'px';
            if (el.type === 'text'){ mini.style.width = (el.width || 300) + 'px'; mini.style.fontSize = el.fontSize || '24px'; mini.style.fontFamily = el.fontFamily || 'Inter'; mini.style.color = el.color || '#000'; mini.style.fontWeight = el.fontWeight || 'normal'; mini.style.whiteSpace = 'pre-wrap'; mini.textContent = el.content; } 
            else if (el.type === 'shape'){ mini.style.width = (el.width||200) + 'px'; mini.style.height = (el.height||100) + 'px'; mini.style.background = el.shape === 'line' ? (el.stroke || '#C9A430') : (el.fill || 'rgba(201,164,48,.18)'); mini.style.borderRadius = el.shape === 'ellipse' ? '50%' : '6px'; } 
            else { mini.style.width = (el.width||300) + 'px'; mini.style.height = (el.height||200) + 'px'; mini.style.background = 'rgba(130,140,160,0.35)'; mini.style.borderRadius = '4px'; }
            inner.appendChild(mini);
        });
        
        thumb.appendChild(inner);
        const delBtn = document.createElement('button'); delBtn.className = 'thumb-delete'; delBtn.innerHTML = icon('trash','icon-sm'); delBtn.onclick = (e) => { e.stopPropagation(); deleteSlide(idx); }; thumb.appendChild(delBtn);
        const num = document.createElement('span'); num.className = 'slide-number'; num.textContent = idx + 1; thumb.appendChild(num);
        container.appendChild(thumb);
        inner.style.transform = 'scale(' + (thumb.clientWidth / 960) + ')';
    });
    
    document.getElementById('bg-color-input').value = getCurrentSlide().background.color || '#ffffff';
    document.getElementById('slide-transition-select').value = getCurrentSlide().transition || 'trans-blur-enter';
}

function onSlideDrop(targetIdx){
    if (draggedSlideIndex === null || draggedSlideIndex === targetIdx) return;
    pushHistory();
    const currentId = presentation.slides[currentSlideIndex].id;
    const [moved] = presentation.slides.splice(draggedSlideIndex, 1);
    presentation.slides.splice(targetIdx, 0, moved);
    currentSlideIndex = presentation.slides.findIndex(s => s.id === currentId);
    draggedSlideIndex = null;
    renderSidebar(); renderCanvas();
}

function switchSlide(idx){ currentSlideIndex = idx; selectedElementId = null; renderSidebar(); renderCanvas(); renderInspector(); }
function deleteSlide(idx){
    if (presentation.slides.length <= 1){ toast('Dernière diapositive.', 'error'); return; }
    pushHistory(); presentation.slides.splice(idx, 1);
    if (currentSlideIndex >= presentation.slides.length) currentSlideIndex = presentation.slides.length - 1;
    selectedElementId = null; renderSidebar(); renderCanvas(); renderInspector();
}

/* =======================================================================
   RENDU SCÈNE CENTRALE
======================================================================= */
function updateCanvasScale(){
    const container = document.querySelector('.stage-container');
    const availW = container.clientWidth - 52, availH = container.clientHeight - 52;
    canvasScale = Math.max(0.25, Math.min(availW/960, availH/540, 2.2));
    document.getElementById('canvas-scaler').style.transform = 'scale(' + canvasScale + ')';
}
window.addEventListener('resize', updateCanvasScale);

function renderCanvas(){
    const canvas = document.getElementById('main-canvas');
    const slide = getCurrentSlide();
    canvas.style.backgroundColor = slide.background.color || '#ffffff';
    canvas.style.backgroundImage = slide.background.image ? 'url(' + slide.background.image + ')' : 'none';
    
    Array.from(canvas.querySelectorAll('.canvas-element, .page-number-badge')).forEach(n => n.remove());
    
    slide.elements.forEach(el => {
        const domEl = document.createElement('div');
        domEl.className = 'canvas-element' + (el.id === selectedElementId ? ' selected' : '');
        domEl.style.left = el.x + 'px'; domEl.style.top = el.y + 'px'; domEl.dataset.id = el.id;
        
        // Molette pour zoomer la taille
        domEl.onwheel = (e) => {
            if (el.id === selectedElementId) {
                e.preventDefault(); const delta = e.deltaY < 0 ? 1 : -1;
                pushHistory();
                if (el.type === 'text') {
                    let size = parseInt(el.fontSize || 24); el.fontSize = Math.max(10, size + delta * 4) + 'px';
                } else {
                    let step = 15; let ratio = el.height / el.width;
                    el.width = Math.max(20, el.width + delta * step); el.height = Math.max(20, el.height + delta * step * ratio);
                }
                renderCanvas(); renderInspector();
            }
        };

        if (el.type === 'text'){
            domEl.innerText = el.content; domEl.style.fontSize = el.fontSize || '24px';
            domEl.style.fontFamily = el.fontFamily || "'Inter', sans-serif";
            domEl.style.color = el.color || '#000'; domEl.style.fontWeight = el.fontWeight || 'normal';
            domEl.style.fontStyle = el.fontStyle || 'normal'; domEl.style.textAlign = el.textAlign || 'left';
            domEl.style.whiteSpace = 'pre-wrap'; if (el.width) domEl.style.width = el.width + 'px';
            domEl.ondblclick = (e) => { e.stopPropagation(); enableTextEdit(domEl, el); };
        
        } else if (el.type === 'chart'){
            const w = el.width || 400, h = el.height || 250;
            if (el.chartType === 'line') {
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <polyline fill="none" stroke="#C9A430" stroke-width="3" points="0,80 20,60 40,70 60,30 80,40 100,10" />
                    <circle cx="20" cy="60" r="2" fill="#E3BE55"/><circle cx="40" cy="70" r="2" fill="#E3BE55"/>
                    <circle cx="60" cy="30" r="2" fill="#E3BE55"/><circle cx="80" cy="40" r="2" fill="#E3BE55"/>
                    <line x1="0" y1="100" x2="100" y2="100" stroke="var(--ink-border-strong)" stroke-width="2"></line>
                </svg>`;
            } else if (el.chartType === 'donut') {
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="transparent" stroke="#E3BE55" stroke-width="15" stroke-dasharray="100 200" stroke-dashoffset="0"></circle>
                    <circle cx="50" cy="50" r="40" fill="transparent" stroke="#C9A430" stroke-width="15" stroke-dasharray="80 200" stroke-dashoffset="-100"></circle>
                    <circle cx="50" cy="50" r="40" fill="transparent" stroke="#A9871F" stroke-width="15" stroke-dasharray="70 200" stroke-dashoffset="-180"></circle>
                </svg>`;
            } else if (el.chartType === 'bar') {
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <rect x="10" y="40" width="15" height="60" fill="#C9A430" rx="2"></rect>
                    <rect x="35" y="20" width="15" height="80" fill="#E3BE55" rx="2"></rect>
                    <rect x="60" y="50" width="15" height="50" fill="#A9871F" rx="2"></rect>
                    <rect x="85" y="10" width="15" height="90" fill="#C9A430" rx="2"></rect>
                    <line x1="0" y1="100" x2="100" y2="100" stroke="var(--ink-border-strong)" stroke-width="2"></line>
                </svg>`;
            } else { // Pie
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="#E3BE55" ></circle>
                    <path d="M50,50 L50,10 A40,40 0 0,1 90,50 Z" fill="#C9A430" ></path>
                    <path d="M50,50 L90,50 A40,40 0 0,1 50,90 Z" fill="#A9871F" ></path>
                </svg>`;
            }
        } else if (el.type === 'image'){ domEl.innerHTML = '<img src="' + el.content + '" style="width:100%;height:100%;">';
        } else if (el.type === 'video'){
            const embed = buildYouTubeEmbed(el.content);
            if (embed) domEl.innerHTML = '<iframe src="' + embed + '" style="width:100%;height:100%;" allowfullscreen></iframe>';
            else domEl.innerHTML = '<video src="' + el.content + '" controls style="width:100%;height:100%;background:#000;"></video>';
        } else if (el.type === 'shape'){
            if (el.shape === 'triangle') {
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,0 100,100 0,100" fill="${el.fill||'#C9A430'}" stroke="${el.stroke||'none'}" stroke-width="${el.strokeWidth||0}"></polygon></svg>`;
            } else if (el.shape === 'star') {
                domEl.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,5 61,40 98,40 68,62 79,98 50,75 21,98 32,62 2,40 39,40" fill="${el.fill||'#C9A430'}" stroke="${el.stroke||'none'}" stroke-width="${el.strokeWidth||0}"></polygon></svg>`;
            } else {
                domEl.innerHTML = el.shape === 'line' ? '<div style="width:100%;height:100%;background:' + (el.stroke||'#C9A430') + ';border-radius:' + (el.strokeWidth||4) + 'px;"></div>' : '<div style="width:100%;height:100%;background:' + (el.fill||'rgba(201,164,48,0.18)') + ';border:' + (el.strokeWidth ?? 2) + 'px solid ' + (el.stroke||'#C9A430') + ';border-radius:' + (el.shape==='ellipse' ? '50%' : '10px') + ';"></div>';
            }
        }
        
        if (el.type !== 'text' && el.width) domEl.style.width = el.width + 'px';
        if (el.type !== 'text' && el.height) domEl.style.height = el.height + 'px';
        
        domEl.onmousedown = (e) => {
            if (domEl.isContentEditable || e.target.tagName === 'IFRAME' || e.target.tagName === 'VIDEO') return;
            startDrag(e, el, domEl);
        };
        
        if (el.id === selectedElementId){
            if (el.type === 'text') domEl.appendChild(makeHandle('e', el));
            else ['nw','ne','sw','se'].forEach(c => domEl.appendChild(makeHandle(c, el)));
        }
        canvas.appendChild(domEl);
    });

    if (presentation.showPageNumbers){
        const badge = document.createElement('div'); badge.className = 'page-number-badge'; badge.textContent = (currentSlideIndex + 1) + ' / ' + presentation.slides.length; canvas.appendChild(badge);
    }
}

function makeHandle(corner, el){
    const h = document.createElement('div'); h.className = 'resize-handle ' + corner;
    h.onmousedown = (e) => { e.stopPropagation(); startResize(e, el, corner); }; return h;
}

function buildYouTubeEmbed(url){
    if (!url) return null; let id = null, m = url.match(/[?&]v=([^&]+)/); if(m)id=m[1];
    if(!id){m=url.match(/youtu\.be\/([^?&]+)/);if(m)id=m[1];}
    if(!id){m=url.match(/youtube\.com\/embed\/([^?&]+)/);if(m)id=m[1];}
    return id ? ('https://www.youtube.com/embed/' + id) : null;
}

function enableTextEdit(domEl, el){
    pushHistory(); domEl.contentEditable = 'true'; domEl.focus(); document.execCommand && document.execCommand('selectAll', false, null);
    domEl.onblur = () => { domEl.contentEditable = 'false'; el.content = domEl.innerText; domEl.onblur = null; renderCanvas(); };
}

/* Drag & Drop Canvas */
function startDrag(e, el, domEl){
    pushHistory(); isDragging = true; selectElement(el.id);
    const rect = document.getElementById('main-canvas').getBoundingClientRect();
    dragOffset.x = (e.clientX - rect.left) / canvasScale - el.x; dragOffset.y = (e.clientY - rect.top) / canvasScale - el.y;
    dragElW = domEl.offsetWidth / canvasScale; dragElH = domEl.offsetHeight / canvasScale;
    document.onmousemove = onDragMove; document.onmouseup = onDragEnd;
}
function onDragMove(e){
    if (!isDragging || !selectedElementId) return;
    const rect = document.getElementById('main-canvas').getBoundingClientRect();
    let newX = (e.clientX - rect.left) / canvasScale - dragOffset.x, newY = (e.clientY - rect.top) / canvasScale - dragOffset.y;
    const el = getCurrentSlide().elements.find(i => i.id === selectedElementId); if (!el) return;
    el.x = Math.round(newX); el.y = Math.round(newY); renderCanvas();
}
function onDragEnd(){ isDragging = false; document.onmousemove = null; document.onmouseup = null; }

/* Resize */
function startResize(e, el, corner){
    pushHistory(); isResizing = true;
    resizeInfo = { el, corner, startClientX:e.clientX, startClientY:e.clientY, startX:el.x, startY:el.y, startW: el.width || 200, startH: el.height || 120 };
    document.onmousemove = onResizeMove; document.onmouseup = onResizeEnd;
}
function onResizeMove(e){
    if (!isResizing || !resizeInfo) return;
    const { el, corner, startClientX, startClientY, startX, startY, startW, startH } = resizeInfo;
    const dx = (e.clientX - startClientX) / canvasScale, dy = (e.clientY - startClientY) / canvasScale;
    if (corner === 'e'){ el.width = Math.max(80, startW + dx); }
    if (corner === 'se'){ el.width = Math.max(30, startW + dx); el.height = Math.max(30, startH + dy); }
    if (corner === 'sw'){ el.width = Math.max(30, startW - dx); el.x = startX + (startW - el.width); el.height = Math.max(30, startH + dy); }
    if (corner === 'ne'){ el.width = Math.max(30, startW + dx); el.height = Math.max(30, startH - dy); el.y = startY + (startH - el.height); }
    if (corner === 'nw'){ el.width = Math.max(30, startW - dx); el.x = startX + (startW - el.width); el.height = Math.max(30, startH - dy); el.y = startY + (startH - el.height); }
    renderCanvas();
}
function onResizeEnd(){ isResizing = false; resizeInfo = null; document.onmousemove = null; document.onmouseup = null; }

/* Selection */
function selectElement(id){ selectedElementId = id; renderCanvas(); renderInspector(); }
function deselectAll(e){
    if (e.target.id === 'main-canvas' || e.target.classList.contains('stage-container') || e.target.id === 'canvas-scaler'){
        selectedElementId = null; renderCanvas(); renderInspector();
    }
}

/* =======================================================================
   INSPECTEUR (OUTILS DANS LA DIAPOSITIVE)
======================================================================= */
function renderInspector(){
    const title = document.getElementById('inspector-title');
    const container = document.getElementById('inspector-content');
    const el = getCurrentSlide().elements.find(i => i.id === selectedElementId);
    
    if (!el){
        title.textContent = 'Configuration Diapo';
        const slide = getCurrentSlide();
        container.innerHTML = `
            <div class="form-field">
                <label>Image de fond (URL)</label>
                <input class="field" style="width:100%;" value="${slide.background.image||''}" onchange="updateSlideBackgroundImage(this.value)">
            </div>
            ${slide.background.image ? `<button class="btn btn-ghost-danger" onclick="updateSlideBackgroundImage('')">Retirer</button>` : ''}
            <hr style="border-top:1px solid var(--ink-border); margin:8px 0;">
            <div class="form-field">
                <label>Notes (Présentateur)</label>
                <textarea class="field" style="width:100%;" onblur="updateSlideNotes(this.value)">${slide.notes||''}</textarea>
            </div>
            <p class="small-note" style="margin-top:10px;">Sélectionnez un élément pour modifier ses propriétés (Couleur, Taille, Font...).</p>`;
        return;
    }
    
    title.textContent = el.type === 'text' ? 'Propriétés Texte' : el.type === 'image' ? 'Image' : el.type === 'video' ? 'Vidéo' : el.type === 'chart' ? 'Infographie' : 'Forme';
    let html = '';
    
    // Contenu
    if (el.type === 'text'){ html += `<div class="form-field"><label>Texte</label><textarea class="field" id="prop-content">${el.content}</textarea></div>`; }
    else if (el.type !== 'shape' && el.type !== 'chart'){ html += `<div class="form-field"><label>URL / Source</label><input class="field" id="prop-content" value="${el.content}"></div>`; }
    
    // Style Texte
    if(el.type === 'text'){
        let fontOptions = FONTS.map(f => `<option value="${f.val}" ${el.fontFamily===f.val?'selected':''}>${f.name}</option>`).join('');
        html += `
            <div class="form-field" style="margin-top:8px;">
                <label>Police de caractère</label>
                <select class="field" id="prop-fontFamily">${fontOptions}</select>
            </div>
            <div class="row-2" style="margin-top:8px;">
                <div class="form-field"><label>Taille (px)</label><input type="number" class="field" id="prop-fontSize" value="${parseInt(el.fontSize||24)}"></div>
                <div class="form-field"><label>Couleur</label><input type="color" class="field-color" id="prop-color" value="${el.color||'#000000'}"></div>
            </div>
            <div class="icon-row" style="margin-top:10px;">
                <button class="btn btn-icon ${el.fontWeight==='bold'?'active':''}" onclick="toggleStyle('fontWeight','bold','normal')"><b>B</b></button>
                <button class="btn btn-icon ${el.fontStyle==='italic'?'active':''}" onclick="toggleStyle('fontStyle','italic','normal')"><i>I</i></button>
                <button class="btn btn-icon ${(el.textAlign||'left')==='left'?'active':''}" onclick="setTextAlign('left')">${icon('alignLeft')}</button>
                <button class="btn btn-icon ${(el.textAlign||'left')==='center'?'active':''}" onclick="setTextAlign('center')">${icon('alignCenter')}</button>
                <button class="btn btn-icon ${(el.textAlign||'left')==='right'?'active':''}" onclick="setTextAlign('right')">${icon('alignRight')}</button>
            </div>
        `;
    }

    // Propriétés Forme / Graphique
    if (el.type === 'chart'){
        html += `<div class="form-field" style="margin-top:8px;"><label>Type Entreprise</label><select class="field" id="prop-chartType">
            <option value="bar" ${el.chartType==='bar'?'selected':''}>Barres</option>
            <option value="pie" ${el.chartType==='pie'?'selected':''}>Secteurs (Pie)</option>
            <option value="line" ${el.chartType==='line'?'selected':''}>Ligne / Courbe</option>
            <option value="donut" ${el.chartType==='donut'?'selected':''}>Donut</option>
        </select></div>`;
    }
    if (el.type === 'shape'){
        html += `<div class="form-field" style="margin-top:8px;"><label>Forme</label><select class="field" id="prop-shape">
            <option value="rect" ${el.shape==='rect'?'selected':''}>Rectangle</option>
            <option value="ellipse" ${el.shape==='ellipse'?'selected':''}>Ellipse</option>
            <option value="triangle" ${el.shape==='triangle'?'selected':''}>Triangle</option>
            <option value="star" ${el.shape==='star'?'selected':''}>Étoile</option>
            <option value="line" ${el.shape==='line'?'selected':''}>Ligne</option>
        </select></div>`;
        if (el.shape !== 'line') html += `<div class="form-field" style="margin-top:8px;"><label>Remplissage</label><input type="color" class="field-color" id="prop-fill" value="${rgbaToHex(el.fill)||'#c9a430'}"></div>`;
        html += `<div class="row-2" style="margin-top:8px;">
            <div class="form-field"><label>Contour</label><input type="color" class="field-color" id="prop-stroke" value="${el.stroke||'#C9A430'}"></div>
            <div class="form-field"><label>Épaisseur</label><input type="number" class="field" id="prop-strokeWidth" value="${el.strokeWidth??2}"></div>
        </div>`;
    }

    // Animation & Boutons de contrôle
    html += `
        <div class="form-field" style="margin-top:12px;">
            <label>Animation Élément</label>
            <select class="field" id="prop-animation">
                <option value="" ${!el.animation?'selected':''}>Aucune</option>
                <option value="anim-fade" ${el.animation==='anim-fade'?'selected':''}>Fondu</option>
                <option value="anim-slide-up" ${el.animation==='anim-slide-up'?'selected':''}>Glissement Haut</option>
                <option value="anim-slide-left" ${el.animation==='anim-slide-left'?'selected':''}>Glissement Gauche</option>
                <option value="anim-slide-right" ${el.animation==='anim-slide-right'?'selected':''}>Glissement Droite</option>
                <option value="anim-pop" ${el.animation==='anim-pop'?'selected':''}>Apparition Pop</option>
            </select>
        </div>
        
        <div class="row-2" style="margin-top:12px;">
            <button class="btn btn-icon" title="Avancer" onclick="reorderLayer('front')">${icon('front')}</button>
            <button class="btn btn-icon" title="Reculer" onclick="reorderLayer('back')">${icon('back')}</button>
        </div>

        <button class="btn btn-primary" style="margin-top:16px; width:100%;" onclick="applyProperties()">APPLIQUER</button>
        <button class="btn btn-ghost-danger" style="margin-top:8px; width:100%;" onclick="deleteSelected()">
            ${icon('trash','icon-sm')}<span>Supprimer l'élément</span>
        </button>
    `;
    
    container.innerHTML = html;
}

window.applyProperties = function() {
    const el = getCurrentSlide().elements.find(i => i.id === selectedElementId);
    if (!el) return;
    pushHistory();
    
    if(document.getElementById('prop-content')) el.content = document.getElementById('prop-content').value;
    if(document.getElementById('prop-fontFamily')) el.fontFamily = document.getElementById('prop-fontFamily').value;
    if(document.getElementById('prop-fontSize')) el.fontSize = document.getElementById('prop-fontSize').value + 'px';
    if(document.getElementById('prop-color')) el.color = document.getElementById('prop-color').value;
    
    if(document.getElementById('prop-chartType')) el.chartType = document.getElementById('prop-chartType').value;
    
    if(document.getElementById('prop-shape')) el.shape = document.getElementById('prop-shape').value;
    if(document.getElementById('prop-fill')) el.fill = document.getElementById('prop-fill').value;
    if(document.getElementById('prop-stroke')) el.stroke = document.getElementById('prop-stroke').value;
    if(document.getElementById('prop-strokeWidth')) el.strokeWidth = parseInt(document.getElementById('prop-strokeWidth').value);
    
    if(document.getElementById('prop-animation')) el.animation = document.getElementById('prop-animation').value;
    
    renderCanvas(); renderSidebar(); renderInspector();
    toast("Propriétés appliquées", "success");
};

function rgbaToHex(v){ if (!v || v.indexOf('rgba') === -1) return v; return null; }

function toggleStyle(p, v1, v2){ const el = getCurrentSlide().elements.find(i => i.id === selectedElementId); if(el){ pushHistory(); el[p] = el[p]===v1?v2:v1; renderCanvas(); renderInspector(); } }
function setTextAlign(v){ const el = getCurrentSlide().elements.find(i => i.id === selectedElementId); if(el && el.type==='text'){ pushHistory(); el.textAlign=v; renderCanvas(); renderInspector(); } }
function reorderLayer(dir){ const slide = getCurrentSlide(); const idx = slide.elements.findIndex(i => i.id === selectedElementId); if (idx===-1) return; pushHistory(); const [el] = slide.elements.splice(idx,1); if (dir==='front') slide.elements.push(el); else slide.elements.unshift(el); renderCanvas(); }
function deleteSelected(){ pushHistory(); getCurrentSlide().elements = getCurrentSlide().elements.filter(i => i.id !== selectedElementId); selectedElementId = null; renderCanvas(); renderInspector(); renderSidebar(); }

======================================================================= */
function exportPagesData(){
    const blob = new Blob([JSON.stringify(presentation)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
    a.download = (presentation.title||'presentation').replace(/[^a-z0-9\-_ ]/gi,'').trim() + '.pages.data';
    a.click(); URL.revokeObjectURL(url); toast('Format natif exporté', 'success');
}

function exportPPT(){
    if(typeof PptxGenJS === 'undefined') { toast("Erreur de librairie", "error"); return; }
    toast("Génération PowerPoint en cours...", "success");
    let pptx = new PptxGenJS();
    pptx.title = presentation.title;
    
    presentation.slides.forEach(slide => {
        let pptSlide = pptx.addSlide();
        if(slide.background.color) pptSlide.background = { fill: slide.background.color.replace('#','') };
        if(slide.notes) pptSlide.addNotes(slide.notes);
        
        slide.elements.forEach(el => {
            const x = (el.x / 960) * 10, y = (el.y / 540) * 5.625; // Convertir px vers pouces approximatifs
            const w = (el.width / 960) * 10, h = (el.height / 540) * 5.625;
            
            if(el.type === 'text') {
                pptSlide.addText(el.content, { x:x, y:y, w:w, h:1, fontSize: parseInt(el.fontSize)/1.5, color: el.color.replace('#',''), bold: el.fontWeight==='bold', italic: el.fontStyle==='italic' });
            } else if(el.type === 'shape') {
                pptSlide.addShape(pptx.shapes.RECTANGLE, { x:x, y:y, w:w, h:h, fill: {color: (el.stroke||'#C9A430').replace('#','')} });
            }
        });
    });
    pptx.writeFile({ fileName: presentation.title.replace(/[^a-z0-9\-_ ]/gi,'') + ".pptx" });
}

function importProjectFile(file){
    if (!file) return; const reader = new FileReader();
    reader.onload = () => {
        try { const data = JSON.parse(reader.result); if (!data.slides) throw new Error();
            pushHistory(); presentation = data; currentSlideIndex = 0; selectedElementId = null;
            document.getElementById('presentation-title').value = presentation.title||''; setTheme(presentation.theme||'nuit');
            document.getElementById('btn-page-numbers').classList.toggle('active', !!presentation.showPageNumbers);
            renderSidebar(); renderCanvas(); renderInspector(); toast('Projet importé');
        } catch (err){ toast('Fichier invalide.', 'error'); }
    }; reader.readAsText(file);
}

/* =======================================================================
   MODE PRÉSENTATION & LASER/DESSIN
======================================================================= */
function startPresentation(){
    presentIndex = currentSlideIndex;
    const overlay = document.getElementById('presentation-overlay'); overlay.classList.add('active');
    if (overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
    renderPresentSlide();
    
    const drawCv = document.getElementById('presentation-draw-canvas');
    if(drawCv){ drawCv.width = window.innerWidth; drawCv.height = window.innerHeight; drawCtx = drawCv.getContext('2d'); drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; }

    document.addEventListener('keydown', handlePresentKey); document.addEventListener('keyup', handlePresentKeyUp);
    overlay.addEventListener('mousemove', handleOverlayMouseMove);
    overlay.addEventListener('mousedown', onPresentMouseDown); overlay.addEventListener('mouseup', onPresentMouseUp);
    
    presentStartTime = Date.now(); presentTimerHandle = setInterval(updatePresentTimer, 1000); updatePresentTimer(); resetControlsHideTimer();
}

function exitPresentation(){
    const overlay = document.getElementById('presentation-overlay'); overlay.classList.remove('active');
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    document.removeEventListener('keydown', handlePresentKey); document.removeEventListener('keyup', handlePresentKeyUp);
    overlay.removeEventListener('mousemove', handleOverlayMouseMove); overlay.removeEventListener('mousedown', onPresentMouseDown); overlay.removeEventListener('mouseup', onPresentMouseUp);
    document.getElementById('presentation-stage').innerHTML = ''; isLaserActive = false; document.getElementById('laser-pointer').classList.remove('active');
    clearInterval(presentTimerHandle); clearTimeout(controlsHideTimeout);
}

document.addEventListener('fullscreenchange', () => { const overlay = document.getElementById('presentation-overlay'); if (!document.fullscreenElement && overlay.classList.contains('active')) exitPresentation(); });

function onPresentMouseDown(e){
    document.getElementById('laser-pointer').classList.add('clicking'); clickStartX = e.clientX; clickStartY = e.clientY;
    if(isLaserActive && drawCtx) { isDrawing = true; drawCtx.beginPath(); drawCtx.moveTo(e.clientX, e.clientY); }
}
function onPresentMouseUp(e){
    document.getElementById('laser-pointer').classList.remove('clicking'); isDrawing = false;
    if (Math.abs(e.clientX - clickStartX) < 5 && Math.abs(e.clientY - clickStartY) < 5 && !isLaserActive) { nextPresentSlide(); } // Clic = next slide
}
function handleOverlayMouseMove(e){
    if (isLaserActive) {
        const pointer = document.getElementById('laser-pointer'); pointer.style.left = e.clientX + 'px'; pointer.style.top = e.clientY + 'px';
        if(isDrawing && drawCtx) { drawCtx.strokeStyle = pointer.style.backgroundColor || '#ff2d4d'; drawCtx.lineWidth = 4; drawCtx.lineTo(e.clientX, e.clientY); drawCtx.stroke(); }
    }
    resetControlsHideTimer();
}
function resetControlsHideTimer(){
    clearTimeout(controlsHideTimeout); const controls = document.querySelector('.present-controls'), overlay = document.getElementById('presentation-overlay');
    controls.style.opacity = '1'; overlay.style.cursor = isLaserActive ? 'none' : 'auto';
    controlsHideTimeout = setTimeout(() => { controls.style.opacity = '0'; overlay.style.cursor = 'none'; }, 3000);
}
function updatePresentTimer(){
    const secs = Math.floor((Date.now() - presentStartTime) / 1000); const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');
    document.getElementById('present-timer').textContent = m + ':' + s;
}
function handlePresentKey(e){
    if (e.key === 'ArrowRight' || e.key === ' ') nextPresentSlide(); else if (e.key === 'ArrowLeft') prevPresentSlide(); else if (e.key === 'Escape') exitPresentation();
    else if (e.key.toLowerCase() === 'l' && !isLaserActive){
        isLaserActive = true; document.getElementById('laser-pointer').classList.add('active'); setLaserColor('#ff2d4d');
    }
    else if (e.key.toLowerCase() === 'r' && isLaserActive) setLaserColor('#ff2d4d');
    else if (e.key.toLowerCase() === 'g' && isLaserActive) setLaserColor('#2dff7d');
    else if (e.key.toLowerCase() === 'b' && isLaserActive) setLaserColor('#2d89ff');
}
function setLaserColor(hex) { document.getElementById('laser-pointer').style.backgroundColor = hex; document.getElementById('laser-pointer').style.boxShadow = `0 0 16px 6px ${hex}88`; }
function handlePresentKeyUp(e){ if (e.key.toLowerCase() === 'l'){ isLaserActive = false; document.getElementById('laser-pointer').classList.remove('active'); } }

function renderPresentSlide(){
    const stage = document.getElementById('presentation-stage'), slide = presentation.slides[presentIndex];
    document.getElementById('present-slide-counter').textContent = (presentIndex + 1) + ' / ' + presentation.slides.length;
    stage.style.backgroundColor = slide.background.color || '#ffffff'; stage.style.backgroundImage = slide.background.image ? 'url(' + slide.background.image + ')' : 'none';
    if (drawCtx) drawCtx.clearRect(0, 0, drawCtx.canvas.width, drawCtx.canvas.height);
    
    stage.className = 'present-slide'; void stage.offsetWidth; stage.className = 'present-slide ' + (slide.transition || 'trans-blur-enter'); stage.innerHTML = '';
    
    slide.elements.forEach(el => {
        const domEl = document.createElement('div');
        domEl.style.position = 'absolute'; domEl.style.left = (el.x / 960 * 100) + '%'; domEl.style.top = (el.y / 540 * 100) + '%';
        if (el.animation) domEl.className = el.animation;
        
        if (el.type === 'text'){
            domEl.innerText = el.content; domEl.style.fontSize = 'calc(' + parseInt(el.fontSize) + ' * (100vw / 960))';
            domEl.style.fontFamily = el.fontFamily; domEl.style.color = el.color; domEl.style.fontWeight = el.fontWeight; domEl.style.fontStyle = el.fontStyle; domEl.style.textAlign = el.textAlign || 'left'; domEl.style.whiteSpace = 'pre-wrap';
            if (el.width) domEl.style.width = 'calc(' + el.width + ' * (100vw / 960))';
        } else if (el.type === 'image'){
            domEl.innerHTML = '<img src="' + el.content + '" style="width:calc(' + el.width + ' * (100vw / 960));height:calc(' + el.height + ' * (100vw / 960));object-fit:cover;border-radius:4px;">';
        } else if (el.type === 'video'){
            const w = 'calc(' + el.width + ' * (100vw / 960))', h = 'calc(' + el.height + ' * (100vw / 960))'; const embed = buildYouTubeEmbed(el.content);
            if (embed) domEl.innerHTML = '<iframe src="' + embed + '?autoplay=1" style="width:' + w + ';height:' + h + ';border:none;" allow="autoplay" allowfullscreen></iframe>';
            else domEl.innerHTML = '<video src="' + el.content + '" autoplay controls style="width:' + w + ';height:' + h + ';"></video>';
        } else { // Shapes et charts utilisent la même logique d'échelle simple ici (simplifié pour démo)
            const w = 'calc(' + el.width + ' * (100vw / 960))', h = 'calc(' + el.height + ' * (100vw / 960))';
            domEl.innerHTML = `<div style="width:${w};height:${h};background:${el.fill||el.stroke||'#C9A430'}; border-radius:${el.shape==='ellipse'?'50%':'4px'}; opacity:0.8;"></div>`;
        }
        stage.appendChild(domEl);
    });
}
function nextPresentSlide(){ if (presentIndex < presentation.slides.length - 1){ presentIndex++; renderPresentSlide(); } }
function prevPresentSlide(){ if (presentIndex > 0){ presentIndex--; renderPresentSlide(); } }

/* =======================================================================
   INITIALISATION & RACCOURCIS
======================================================================= */
document.addEventListener('keydown', (e) => {
    if (document.getElementById('presentation-overlay').classList.contains('active')) return;
    const tag = (e.target.tagName || '').toUpperCase(); const isEditing = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !isEditing){ e.preventDefault(); undo(); return; }
    if (isEditing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedElementId){ e.preventDefault(); deleteSelected(); return; }
    if (e.key === 'Escape'){ selectedElementId = null; renderCanvas(); renderInspector(); return; }
});

window.onload = () => {
    document.querySelector('#present-prev').innerHTML = icon('chevronLeft');
    document.querySelector('#present-next').innerHTML = icon('chevronRight');
    document.querySelector('#present-exit').innerHTML = icon('close');
    document.getElementById('btn-page-numbers').innerHTML = icon('hash');
    document.querySelectorAll('.header-actions .btn-icon')[1].innerHTML = icon('download');
    document.querySelectorAll('.header-actions .btn-icon')[2].innerHTML = icon('ppt');
    document.querySelectorAll('.header-actions .btn-icon')[3].innerHTML = icon('upload');
    document.querySelector('.btn-primary').innerHTML = icon('play') + '<span>Présenter</span>';
    
    document.getElementById('btn-add-text').innerHTML = icon('type') + '<span>Texte</span>';
    document.getElementById('btn-add-image').innerHTML = icon('image') + '<span>Image</span>';
    document.getElementById('btn-add-video').innerHTML = icon('video') + '<span>Vidéo</span>';
    document.getElementById('btn-add-shape').innerHTML = icon('shape') + '<span>Forme</span>';
    document.getElementById('btn-add-chart').innerHTML = icon('chart') + '<span>Graph.</span>';
    document.getElementById('btn-add-slide').innerHTML = icon('plus') + '<span>Diapo.</span>';

    // Restauration IndexedDB (Mémoire cache)
    localforage.getItem('presentar_backup').then(data => {
        if (data && data.slides) { presentation = data; toast("Projet restauré depuis la mémoire", "success"); }
        updateCanvasScale(); renderSidebar(); renderCanvas(); renderInspector();
    }).catch(() => { updateCanvasScale(); renderSidebar(); renderCanvas(); renderInspector(); });
};
</script>
